spring.application.name=NexCart E-Commerce Platform
server.port=${PORT:8081}

# 24/7 TiDB Serverless Cloud MySQL Database (Persistent Cloud Storage)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/nexcart_db?useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:HVtbf3tQkyxXK4C.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:LACrrRIQSQxK1tDU}

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf Cache (disable for auto-refresh during dev)
spring.thymeleaf.cache=false

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
