<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - NexCart Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="admin-wrapper">
        
        <!-- Sidebar Fragment -->
        <div th:replace="~{fragments/admin-sidebar :: sidebar('products')}"></div>

        <!-- Main Content Area -->
        <main class="admin-main-content">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold m-0 text-dark">Product Inventory Management</h3>
                    <p class="text-muted small m-0">Manage catalog products, pricing, categories & inventory stock</p>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/admin/products/add}" class="btn btn-primary fw-bold px-3 py-2"><i class="fa-solid fa-plus me-1"></i> Add New Product</a>
                    <button onclick="window.history.back()" class="btn btn-outline-secondary fw-bold px-3 py-2">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back
                    </button>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle m-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">S.No</th>
                                <th>Product Info</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Rating</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product, stat : ${products}">
                                <td class="ps-4 fw-semibold text-muted" th:text="${'#' + stat.count}">#1</td>
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <img th:src="${product.imageUrl}" class="rounded-3" style="width: 50px; height: 50px; object-fit: cover;" th:alt="${product.name}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&amp;fit=crop&amp;w=600&amp;q=80';">
                                        <div>
                                            <h6 class="mb-0 fw-bold text-dark" th:text="${product.name}">Product Title</h6>
                                            <small class="text-muted text-truncate d-block" style="max-width: 250px;" th:text="${product.description}">Short description</small>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge bg-secondary-subtle text-secondary px-3 py-1 rounded-pill" 
                                          th:text="${product.category != null ? product.category.name : 'Uncategorized'}">Category</span>
                                </td>
                                <td class="fw-bold text-primary" th:text="${'₹' + #numbers.formatDecimal(product.price, 1, 2)}">₹999.00</td>
                                <td>
                                    <span class="badge" th:classappend="${product.stockQuantity > 10 ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'}"
                                          th:text="${product.stockQuantity + ' Units'}">10 Units</span>
                                </td>
                                <td>
                                    <span class="fw-semibold" th:text="${product.rating}">4.5</span> <i class="fa-solid fa-star text-warning small"></i>
                                </td>
                                <td class="text-end pe-4">
                                    <form th:action="@{/admin/products/edit}" method="post" class="d-inline">
                                        <input type="hidden" name="id" th:value="${product.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-primary me-1" title="Edit">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Are you sure you want to permanently delete this product?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
