<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders - NexCart Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="admin-wrapper">
        
        <!-- Sidebar Fragment -->
        <div th:replace="~{fragments/admin-sidebar :: sidebar('orders')}"></div>

        <!-- Main Content Area -->
        <main class="admin-main-content">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold m-0 text-dark">Customer Orders & Shipment Fulfillment</h3>
                    <p class="text-muted small m-0">Track transactions, customer shipping addresses & update order status</p>
                </div>
                <button onclick="window.history.back()" class="btn btn-outline-secondary fw-bold px-3 py-2">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back
                </button>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle m-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Order #</th>
                                <th>Customer & Shipping Address</th>
                                <th>Items Ordered</th>
                                <th>Order Total</th>
                                <th>Payment Method</th>
                                <th>Status & Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td class="ps-4">
                                    <strong class="text-primary" th:text="${order.orderNumber}">ORD-123</strong>
                                    <small class="d-block text-muted" th:text="${#temporals.format(order.createdAt, 'dd-MMM-yyyy HH:mm')}">Date</small>
                                </td>
                                <td>
                                    <div class="fw-bold text-dark" th:text="${order.user != null ? order.user.name : 'Guest User'}">Customer Name</div>
                                    <small class="text-muted d-block" style="max-width: 220px;" th:text="${order.shippingAddress}">123 Address</small>
                                </td>
                                <td>
                                    <div class="small text-muted" th:each="item : ${order.items}">
                                        <span class="fw-semibold text-dark" th:text="${item.product.name}">Item</span>
                                        <span th:text="${' (x' + item.quantity + ')'}">(x1)</span>
                                    </div>
                                </td>
                                <td class="fw-bold text-dark">
                                    <span th:text="${'₹' + #numbers.formatDecimal(order.totalAmount, 1, 2)}">₹999.00</span>
                                    <small th:if="${order.couponCode != null}" class="d-block text-success fw-normal">
                                        <i class="fa-solid fa-tag me-1"></i><span th:text="${order.couponCode}"></span> (-₹<span th:text="${#numbers.formatDecimal(order.discountAmount, 1, 2)}"></span>)
                                    </small>
                                </td>
                                <td class="small fw-semibold text-secondary" th:text="${order.paymentMethod}">UPI</td>
                                <td>
                                    <form th:action="@{/admin/orders/status}" method="post" class="d-flex align-items-center gap-2">
                                        <input type="hidden" name="orderId" th:value="${order.id}">
                                        <select name="status" class="form-select form-select-sm fw-semibold" style="width: 140px;">
                                            <option th:each="st : ${orderStatuses}" th:value="${st}" 
                                                    th:selected="${order.status == st}" 
                                                    th:text="${st}">STATUS</option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-primary" title="Update Status">
                                            <i class="fa-solid fa-arrows-rotate"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
