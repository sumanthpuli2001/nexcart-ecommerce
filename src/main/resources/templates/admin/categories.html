<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management - NexCart Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="admin-wrapper">
        
        <!-- Sidebar Fragment -->
        <div th:replace="~{fragments/admin-sidebar :: sidebar('categories')}"></div>

        <!-- Main Content Area -->
        <main class="admin-main-content">
            
            <!-- Top Header -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3 bg-white p-3 rounded-4 shadow-sm border">
                <div>
                    <h4 class="fw-bold mb-1 text-dark"><i class="fa-solid fa-layer-group text-primary me-2"></i>Product Categories</h4>
                    <p class="text-muted small mb-0">Organize and manage catalog departments and taxonomy.</p>
                </div>
                <button type="button" class="btn btn-warning fw-bold text-dark px-3 py-2" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                    <i class="fa-solid fa-plus me-1"></i> Add New Category
                </button>
            </div>

            <div class="container-fluid p-0">

                <!-- Flash Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Category Listing Card -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                    <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                        <h6 class="fw-bold mb-0 text-dark">Active Product Categories (<span th:text="${categories.size()}">0</span>)</h6>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-muted small text-uppercase">
                                <tr>
                                    <th style="width: 80px;">ID</th>
                                    <th>Category Details</th>
                                    <th>Description</th>
                                    <th class="text-center">Catalog Products</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${categories.empty}">
                                    <td colspan="5" class="text-center py-5 text-muted">
                                        <i class="fa-solid fa-layer-group fs-2 mb-2 d-block opacity-50"></i>
                                        No categories found. Click "Add New Category" above to create one.
                                    </td>
                                </tr>
                                <tr th:each="cat : ${categories}">
                                    <td class="fw-bold text-muted" th:text="${'#' + cat.id}">#1</td>
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <div class="rounded-3 bg-light border p-2 text-center" style="width: 48px; height: 48px;">
                                                <i class="fa-solid fa-tag text-primary fs-4 mt-1"></i>
                                            </div>
                                            <div>
                                                <span class="fw-bold text-dark d-block" th:text="${cat.name}">Electronics</span>
                                                <small class="text-muted" th:text="${cat.imageUrl != null && !cat.imageUrl.isEmpty() ? 'Custom banner configured' : 'Default icon'}"></small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="text-muted small" style="max-width: 320px;" th:text="${cat.description != null && !cat.description.isEmpty() ? cat.description : 'No description provided.'}">Description</td>
                                    <td class="text-center">
                                        <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-1 rounded-pill" 
                                              th:text="${(productCounts[cat.id] != null ? productCounts[cat.id] : 0) + ' Products'}">0 Products</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="d-flex justify-content-end gap-2">
                                            <button type="button" class="btn btn-sm btn-outline-primary" 
                                                    data-bs-toggle="modal" th:data-bs-target="${'#editCategoryModal' + cat.id}">
                                                <i class="fa-solid fa-pen-to-square me-1"></i> Edit
                                            </button>
                                            <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="post" 
                                                  onsubmit="return confirm('Are you sure you want to delete this category? Linked products must be reassigned first.');" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" 
                                                        th:disabled="${productCounts[cat.id] != null && productCounts[cat.id] > 0}">
                                                    <i class="fa-solid fa-trash me-1"></i> Delete
                                                </button>
                                            </form>
                                        </div>

                                        <!-- Edit Modal for this category -->
                                        <div class="modal fade" th:id="${'editCategoryModal' + cat.id}" tabindex="-1" aria-hidden="true">
                                            <div class="modal-dialog modal-dialog-centered text-start">
                                                <div class="modal-content border-0 shadow-lg rounded-4">
                                                    <div class="modal-header border-bottom">
                                                        <h5 class="modal-title fw-bold text-dark"><i class="fa-solid fa-pen-to-square me-2 text-primary"></i>Edit Category</h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <form th:action="@{/admin/categories/edit}" method="post">
                                                        <input type="hidden" name="id" th:value="${cat.id}">
                                                        <div class="modal-body p-4">
                                                            <div class="mb-3">
                                                                <label class="form-label fw-semibold">Category Name <span class="text-danger">*</span></label>
                                                                <input type="text" name="name" class="form-control" th:value="${cat.name}" required minlength="2">
                                                            </div>
                                                            <div class="mb-3">
                                                                <label class="form-label fw-semibold">Description</label>
                                                                <textarea name="description" class="form-control" rows="3" th:text="${cat.description}" placeholder="Brief description of products in this category"></textarea>
                                                            </div>
                                                            <div class="mb-3">
                                                                <label class="form-label fw-semibold">Category Banner / Image URL (Optional)</label>
                                                                <input type="url" name="imageUrl" class="form-control" th:value="${cat.imageUrl}" placeholder="https://images.unsplash.com/...">
                                                            </div>
                                                        </div>
                                                        <div class="modal-footer border-top bg-light">
                                                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                                                            <button type="submit" class="btn btn-primary fw-bold">Save Changes</button>
                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>

                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Add Category Modal -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title fw-bold text-dark"><i class="fa-solid fa-plus-circle me-2 text-warning"></i>Add New Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/categories/add}" method="post">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Health & Wellness" required minlength="2">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Brief summary of department items"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Image Banner URL (Optional)</label>
                            <input type="url" name="imageUrl" class="form-control" placeholder="https://images.unsplash.com/...">
                        </div>
                    </div>
                    <div class="modal-footer border-top bg-light">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-warning fw-bold text-dark">Create Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
